<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Graph Viewer - Telegram Bot Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; }
        #cy { width: 100vw; height: 100vh; background-color: #f1f5f9; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 600;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            transition: transform 0.3s ease;
            z-index: 100;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="cy"></div>

    <!-- Top Control Bar -->
    <div class="absolute top-4 left-4 right-4 glass-panel rounded-xl p-3 flex items-center justify-between z-20">
        <div class="flex items-center gap-3">
            <h1 class="font-bold text-lg text-slate-700 whitespace-nowrap">
                <i class="fa-solid fa-diagram-project mr-2 text-blue-600"></i>Graph Viewer
            </h1>
            
            <!-- Search Box -->
            <div class="relative">
                <input type="text" id="searchInput" placeholder="Cari fungsi atau file..." 
                    class="pl-9 pr-20 py-2 bg-slate-100 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-64 text-slate-700 placeholder-slate-400">
                <i class="fa-solid fa-search absolute left-3 top-2.5 text-slate-400"></i>
                <div id="searchNav" class="hidden absolute right-2 top-1.5 flex items-center gap-1 bg-white rounded shadow-sm border border-slate-200 px-1">
                    <button onclick="navigateSearch(-1)" class="p-1 hover:bg-slate-100 rounded text-slate-600"><i class="fa-solid fa-chevron-up text-xs"></i></button>
                    <span id="searchCount" class="text-xs px-1 text-slate-700 font-mono">0/0</span>
                    <button onclick="navigateSearch(1)" class="p-1 hover:bg-slate-100 rounded text-slate-600"><i class="fa-solid fa-chevron-down text-xs"></i></button>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-2 flex-wrap justify-end">
            <!-- Filters -->
            <select id="typeFilter" onchange="applyFilters()" class="bg-slate-100 border border-slate-200 rounded-lg text-sm px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-700 cursor-pointer">
                <option value="all">Semua Tipe</option>
                <option value="function">Fungsi Proyek</option>
                <option value="builtin">Builtin/Stdlib</option>
            </select>

            <select id="moduleFilter" onchange="applyModuleFilter()" class="bg-slate-100 border border-slate-200 rounded-lg text-sm px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-700 cursor-pointer max-w-[200px]">
                <option value="all">Semua Modul</option>
            </select>

            <button onclick="toggleHeatmap()" id="btnHeatmap" class="px-3 py-2 bg-orange-100 text-orange-700 rounded-lg text-sm hover:bg-orange-200 transition font-medium" title="Toggle Complexity Heatmap">
                <i class="fa-solid fa-fire mr-1"></i> Heatmap
            </button>

            <button onclick="detectCycles()" class="px-3 py-2 bg-purple-100 text-purple-700 rounded-lg text-sm hover:bg-purple-200 transition font-medium" title="Detect Cycles">
                <i class="fa-solid fa-rotate mr-1"></i> Cycles
            </button>

            <button onclick="exportMermaid()" class="px-3 py-2 bg-indigo-100 text-indigo-700 rounded-lg text-sm hover:bg-indigo-200 transition font-medium" title="Export Mermaid">
                <i class="fa-solid fa-code mr-1"></i> Mermaid
            </button>

            <button onclick="exportImage()" class="p-2 text-slate-600 hover:text-emerald-600 hover:bg-emerald-50 rounded-lg transition" title="Export PNG">
                <i class="fa-solid fa-camera"></i>
            </button>

            <button onclick="resetView()" class="p-2 text-slate-600 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition" title="Reset View">
                <i class="fa-solid fa-compress-arrows-alt"></i>
            </button>

            <label class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-md flex items-center gap-2">
                <i class="fa-solid fa-upload"></i> Upload JSON
                <input type="file" id="fileInput" accept=".json" class="hidden" onchange="handleFileUpload(event)">
            </label>
        </div>
    </div>

    <!-- Legend -->
    <div class="absolute bottom-4 left-4 glass-panel rounded-xl p-3 z-10 text-xs">
        <div class="font-bold text-slate-700 mb-2">Legenda</div>
        <div class="space-y-1">
            <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-blue-600 inline-block"></span> Fungsi Proyek</div>
            <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-slate-400 inline-block"></span> Builtin/Stdlib</div>
            <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span> Node Dipilih</div>
            <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span> Dalam Siklus</div>
            <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full opacity-30 bg-slate-400 inline-block"></span> Deactive</div>
        </div>
    </div>

    <!-- Stats Panel -->
    <div id="statsPanel" class="absolute bottom-4 right-4 glass-panel rounded-xl p-3 z-10 text-xs hidden">
        <div class="font-bold text-slate-700 mb-2">Statistik Graf</div>
        <div class="grid grid-cols-2 gap-2">
            <div><span class="text-slate-500">Nodes:</span> <span id="statNodes" class="font-bold text-slate-700">0</span></div>
            <div><span class="text-slate-500">Edges:</span> <span id="statEdges" class="font-bold text-slate-700">0</span></div>
            <div><span class="text-slate-500">Modul:</span> <span id="statModules" class="font-bold text-slate-700">0</span></div>
            <div><span class="text-slate-500">Siklus:</span> <span id="statCycles" class="font-bold text-red-600">0</span></div>
        </div>
    </div>

    <!-- Sidebar Inspector -->
    <div id="sidebar" class="absolute top-20 right-4 w-80 glass-panel rounded-xl p-5 transform translate-x-full transition-transform duration-300 z-10 max-h-[calc(100vh-120px)] overflow-y-auto">
        <div class="flex justify-between items-start mb-4 border-b border-slate-200 pb-2">
            <h2 class="font-bold text-slate-800 text-lg">Node Details</h2>
            <button onclick="closeSidebar()" class="text-slate-400 hover:text-red-500 transition"><i class="fa-solid fa-times text-lg"></i></button>
        </div>
        
        <div class="space-y-4">
            <div>
                <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Function Name</label>
                <div id="detailId" class="mt-1 text-sm font-mono bg-slate-100 p-2 rounded border border-slate-200 break-all text-slate-700"></div>
            </div>
            
            <div>
                <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Source File</label>
                <div id="detailFile" class="mt-1 text-sm text-blue-600 font-medium break-all"></div>
            </div>

            <div class="grid grid-cols-3 gap-2">
                <div class="bg-blue-50 p-2 rounded border border-blue-100 text-center">
                    <div class="text-xs text-blue-600 font-bold">In</div>
                    <div id="detailIn" class="text-lg font-bold text-blue-800">0</div>
                </div>
                <div class="bg-emerald-50 p-2 rounded border border-emerald-100 text-center">
                    <div class="text-xs text-emerald-600 font-bold">Out</div>
                    <div id="detailOut" class="text-lg font-bold text-emerald-800">0</div>
                </div>
                <div class="bg-purple-50 p-2 rounded border border-purple-100 text-center">
                    <div class="text-xs text-purple-600 font-bold">Total</div>
                    <div id="detailTotal" class="text-lg font-bold text-purple-800">0</div>
                </div>
            </div>

            <div class="pt-2 border-t border-slate-200">
                <label class="text-xs font-bold text-slate-500 uppercase mb-2 block">Flow Analysis</label>
                <div class="flex flex-col gap-2">
                    <button onclick="highlightPredecessors()" class="w-full text-left px-3 py-2 text-sm text-slate-700 hover:bg-slate-100 rounded border border-slate-200 transition flex items-center">
                        <i class="fa-solid fa-arrow-left mr-2 text-blue-500"></i> Show Callers (Predecessors)
                    </button>
                    <button onclick="highlightSuccessors()" class="w-full text-left px-3 py-2 text-sm text-slate-700 hover:bg-slate-100 rounded border border-slate-200 transition flex items-center">
                        <i class="fa-solid fa-arrow-right mr-2 text-emerald-500"></i> Show Called (Successors)
                    </button>
                    <button onclick="resetHighlight()" class="w-full text-left px-3 py-2 text-sm text-slate-500 hover:bg-slate-100 rounded border border-slate-200 transition flex items-center">
                        <i class="fa-solid fa-eraser mr-2"></i> Reset Highlight
                    </button>
                </div>
            </div>

            <div class="pt-2 border-t border-slate-200">
                <label class="text-xs font-bold text-slate-500 uppercase mb-2 block">Simulation</label>
                <button onclick="toggleNodeStatus()" class="w-full px-3 py-2 text-sm bg-slate-100 hover:bg-slate-200 rounded border border-slate-200 text-slate-700 transition flex items-center justify-between">
                    <span><i class="fa-solid fa-power-off mr-2"></i> Toggle Active/Deactive</span>
                    <span class="badge bg-slate-300 text-slate-700">D</span>
                </button>
                <button onclick="findPathFromSelected()" id="btnPath" class="hidden w-full mt-2 px-3 py-2 text-sm bg-amber-100 hover:bg-amber-200 rounded border border-amber-200 text-amber-800 transition flex items-center">
                    <i class="fa-solid fa-route mr-2"></i> Find Path to This Node
                </button>
            </div>

            <div id="impactList" class="hidden pt-2 border-t border-slate-200">
                <label class="text-xs font-bold text-slate-500 uppercase">Impacted Functions (Downstream)</label>
                <ul id="impactUl" class="mt-2 text-xs text-slate-600 space-y-1 max-h-40 overflow-y-auto bg-slate-50 p-2 rounded border border-slate-200"></ul>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading" class="fixed inset-0 bg-white/90 z-50 flex flex-col items-center justify-center hidden">
        <div class="animate-spin rounded-full h-16 w-16 border-4 border-blue-100 border-t-blue-600 mb-4"></div>
        <p class="text-slate-600 font-semibold text-lg">Memproses Graf...</p>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast glass-panel rounded-lg px-4 py-3 text-sm text-slate-700 font-medium"></div>

    <script>
        let cy;
        let graphData = null;
        let searchResults = [];
        let currentSearchIndex = -1;
        let selectedNode = null;
        let pathStartNode = null;
        let heatmapActive = false;
        let modules = {};
        let moduleColors = {};

        // Module color palette
        const MODULE_PALETTE = [
            '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6',
            '#ec4899', '#14b8a6', '#f97316', '#6366f1', '#84cc16'
        ];

        document.addEventListener('DOMContentLoaded', () => {
            cy = cytoscape({
                container: document.getElementById('cy'),
                style: [
                    {
                        selector: 'node',
                        style: {
                            'label': 'data(id)',
                            'color': '#ffffff',
                            'font-size': '10px',
                            'font-weight': 'bold',
                            'text-valign': 'center',
                            'text-halign': 'center',
                            'width': '40px',
                            'height': '40px',
                            'border-width': 2,
                            'border-color': '#ffffff',
                            'text-outline-width': 1,
                            'text-outline-color': '#3b82f6',
                            'background-color': '#3b82f6'
                        }
                    },
                    {
                        selector: 'node[type="function"]',
                        style: { 'background-color': '#2563eb', 'text-outline-color': '#2563eb' }
                    },
                    {
                        selector: 'node[!type]',
                        style: { 
                            'background-color': '#94a3b8', 
                            'width': '28px', 
                            'height': '28px', 
                            'font-size': '8px',
                            'text-outline-color': '#94a3b8',
                            'border-width': 1.5
                        }
                    },
                    {
                        selector: 'edge',
                        style: {
                            'width': 1.5,
                            'line-color': '#cbd5e1',
                            'target-arrow-color': '#cbd5e1',
                            'target-arrow-shape': 'triangle',
                            'curve-style': 'bezier',
                            'opacity': 0.6
                        }
                    },
                    {
                        selector: 'node.highlighted',
                        style: {
                            'background-color': '#f59e0b',
                            'border-color': '#d97706',
                            'text-outline-color': '#f59e0b',
                            'border-width': 3,
                            'z-index': 999
                        }
                    },
                    {
                        selector: 'node.path-node',
                        style: {
                            'background-color': '#10b981',
                            'border-color': '#059669',
                            'text-outline-color': '#10b981',
                            'border-width': 3
                        }
                    },
                    {
                        selector: 'node.cycle-node',
                        style: {
                            'background-color': '#ef4444',
                            'border-color': '#dc2626',
                            'text-outline-color': '#ef4444',
                            'border-width': 3
                        }
                    },
                    {
                        selector: 'node.deactive',
                        style: {
                            'opacity': 0.15,
                            'background-color': '#94a3b8',
                            'text-outline-color': '#94a3b8'
                        }
                    },
                    {
                        selector: 'edge.highlighted',
                        style: {
                            'line-color': '#f59e0b',
                            'target-arrow-color': '#f59e0b',
                            'width': 3,
                            'opacity': 1,
                            'z-index': 999
                        }
                    },
                    {
                        selector: 'edge.path-edge',
                        style: {
                            'line-color': '#10b981',
                            'target-arrow-color': '#10b981',
                            'width': 3,
                            'opacity': 1
                        }
                    },
                    {
                        selector: 'edge.cycle-edge',
                        style: {
                            'line-color': '#ef4444',
                            'target-arrow-color': '#ef4444',
                            'width': 2.5,
                            'opacity': 1
                        }
                    },
                    {
                        selector: 'edge.deactive',
                        style: { 'opacity': 0.05 }
                    },
                    {
                        selector: '.faded',
                        style: { 'opacity': 0.1 }
                    }
                ],
                layout: {
                    name: 'cose',
                    animate: true,
                    animationDuration: 800,
                    nodeRepulsion: 8000,
                    idealEdgeLength: 100,
                    gravity: 0.5
                },
                wheelSensitivity: 0.2
            });

            // Event: Click Node
            cy.on('tap', 'node', function(evt){
                const node = evt.target;
                selectedNode = node;
                showNodeDetails(node);
                updatePathButton();
            });

            // Event: Click Empty Space
            cy.on('tap', function(evt){
                if(evt.target === cy){
                    closeSidebar();
                    resetHighlight();
                    selectedNode = null;
                    updatePathButton();
                }
            });

            // Drag and Drop
            document.body.addEventListener('dragover', (e) => { e.preventDefault(); });
            document.body.addEventListener('drop', (e) => {
                e.preventDefault();
                if(e.dataTransfer.files.length) handleFileUpload({ target: { files: e.dataTransfer.files } });
            });

            // Search
            document.getElementById('searchInput').addEventListener('input', performSearch);

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT') return;
                if (e.key === 'd' || e.key === 'D') toggleNodeStatus();
                if (e.key === 'Escape') { closeSidebar(); resetHighlight(); }
            });
        });

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            document.getElementById('loading').classList.remove('hidden');
            
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    graphData = JSON.parse(e.target.result);
                    loadGraph(graphData);
                    showToast(`Graf berhasil dimuat: ${graphData.nodes.length} nodes`);
                } catch (err) {
                    alert("Error parsing JSON: " + err.message);
                } finally {
                    document.getElementById('loading').classList.add('hidden');
                }
            };
            reader.readAsText(file);
        }

        function loadGraph(json) {
            const elements = [];
            modules = {};
            moduleColors = {};
            let colorIdx = 0;

            // 1. Build modules map & compute degree for heatmap
            const degreeMap = {};
            json.nodes.forEach(n => { degreeMap[n.id] = 0; });
            json.edges.forEach(e => {
                degreeMap[e.source] = (degreeMap[e.source] || 0) + 1;
                degreeMap[e.target] = (degreeMap[e.target] || 0) + 1;
            });

            json.nodes.forEach(node => {
                const file = node.file || '';
                const modName = file ? file.split('/').slice(-2).join('/') : 'Built-in';
                if (!modules[modName]) {
                    modules[modName] = { nodes: [], label: modName };
                    moduleColors[modName] = MODULE_PALETTE[colorIdx % MODULE_PALETTE.length];
                    colorIdx++;
                }
                modules[modName].nodes.push(node.id);

                const degree = degreeMap[node.id] || 0;
                elements.push({
                    data: {
                        id: node.id,
                        file: file,
                        module: modName,
                        type: node.type,
                        degree: degree,
                        moduleColor: moduleColors[modName]
                    }
                });
            });

            json.edges.forEach((edge, idx) => {
                elements.push({
                    data: {
                        source: edge.source,
                        target: edge.target,
                        id: `e-${idx}-${edge.source}-${edge.target}`
                    }
                });
            });

            cy.elements().remove();
            cy.add(elements);

            // Populate module filter
            const moduleFilter = document.getElementById('moduleFilter');
            moduleFilter.innerHTML = '<option value="all">Semua Modul</option>';
            Object.keys(modules).sort().forEach(mod => {
                const opt = document.createElement('option');
                opt.value = mod;
                opt.textContent = `${mod} (${modules[mod].nodes.length})`;
                moduleFilter.appendChild(opt);
            });

            // Update stats
            document.getElementById('statNodes').textContent = json.nodes.length;
            document.getElementById('statEdges').textContent = json.edges.length;
            document.getElementById('statModules').textContent = Object.keys(modules).length;
            document.getElementById('statsPanel').classList.remove('hidden');

            // Apply initial coloring by module
            applyModuleColors();

            setTimeout(() => {
                cy.layout({ name: 'cose', animate: true, nodeRepulsion: 8000 }).run();
                cy.fit(null, 50);
            }, 100);
        }

        function applyModuleColors() {
            cy.nodes().forEach(n => {
                if (n.data('type') === 'function') {
                    n.style('background-color', n.data('moduleColor'));
                    n.style('text-outline-color', n.data('moduleColor'));
                }
            });
        }

        function applyHeatmap() {
            const degrees = cy.nodes().map(n => n.data('degree') || 0);
            const maxDeg = Math.max(...degrees, 1);
            
            cy.nodes().forEach(n => {
                const deg = n.data('degree') || 0;
                const ratio = deg / maxDeg;
                // Blue (low) -> Yellow (mid) -> Red (high)
                const hue = 240 - (ratio * 240);
                const color = `hsl(${hue}, 75%, 50%)`;
                n.style('background-color', color);
                n.style('text-outline-color', color);
                // Scale size by degree
                const size = 30 + (ratio * 30);
                n.style('width', size + 'px');
                n.style('height', size + 'px');
            });
        }

        function toggleHeatmap() {
            heatmapActive = !heatmapActive;
            const btn = document.getElementById('btnHeatmap');
            if (heatmapActive) {
                applyHeatmap();
                btn.classList.remove('bg-orange-100', 'text-orange-700');
                btn.classList.add('bg-orange-600', 'text-white');
                showToast('Heatmap aktif: Merah = kompleksitas tinggi');
            } else {
                applyModuleColors();
                // Reset sizes
                cy.nodes('[type="function"]').style({'width': '40px', 'height': '40px'});
                cy.nodes('[!type]').style({'width': '28px', 'height': '28px'});
                btn.classList.add('bg-orange-100', 'text-orange-700');
                btn.classList.remove('bg-orange-600', 'text-white');
                showToast('Heatmap dinonaktifkan');
            }
        }

        // --- Search ---
        function performSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const nav = document.getElementById('searchNav');
            
            if (!query) {
                searchResults = [];
                nav.classList.add('hidden');
                resetHighlight();
                return;
            }

            searchResults = cy.nodes().filter(n => 
                n.data('id').toLowerCase().includes(query) || 
                (n.data('file') && n.data('file').toLowerCase().includes(query))
            );

            nav.classList.remove('hidden');
            
            if (searchResults.length > 0) {
                currentSearchIndex = 0;
                updateSearchFocus();
            } else {
                document.getElementById('searchCount').innerText = '0/0';
            }
        }

        function navigateSearch(direction) {
            if (searchResults.length === 0) return;
            currentSearchIndex += direction;
            if (currentSearchIndex >= searchResults.length) currentSearchIndex = 0;
            if (currentSearchIndex < 0) currentSearchIndex = searchResults.length - 1;
            updateSearchFocus();
        }

        function updateSearchFocus() {
            const node = searchResults[currentSearchIndex];
            document.getElementById('searchCount').innerText = `${currentSearchIndex + 1}/${searchResults.length}`;
            
            cy.nodes().removeClass('highlighted');
            node.addClass('highlighted');
            cy.animate({
                fit: { eles: node, padding: 150 },
                duration: 500
            });
        }

        // --- Filters ---
        function applyFilters() {
            const type = document.getElementById('typeFilter').value;
            if (type === 'all') {
                cy.elements().show();
            } else if (type === 'function') {
                cy.nodes('[type!="function"]').hide();
                cy.nodes('[type="function"]').show();
                cy.edges().show();
            } else if (type === 'builtin') {
                cy.nodes('[type="function"]').hide();
                cy.nodes('[!type]').show();
                cy.edges().show();
            }
        }

        function applyModuleFilter() {
            const mod = document.getElementById('moduleFilter').value;
            if (mod === 'all') {
                cy.elements().show();
            } else {
                cy.nodes().forEach(n => {
                    if (n.data('module') === mod) n.show();
                    else n.hide();
                });
                cy.edges().forEach(e => {
                    if (e.source().visible() && e.target().visible()) e.show();
                    else e.hide();
                });
            }
        }

        // --- Sidebar ---
        function showNodeDetails(node) {
            document.getElementById('detailId').innerText = node.data('id');
            document.getElementById('detailFile').innerText = node.data('file') || 'Built-in/Standard';
            document.getElementById('detailIn').innerText = node.indegree();
            document.getElementById('detailOut').innerText = node.outdegree();
            document.getElementById('detailTotal').innerText = node.indegree() + node.outdegree();
            
            // Impact list
            const successors = node.successors();
            const ul = document.getElementById('impactUl');
            if (successors.length > 0) {
                ul.innerHTML = successors.map(s => `<li class="py-1 border-b border-slate-100 last:border-0">→ ${s.data('id')}</li>`).join('');
                document.getElementById('impactList').classList.remove('hidden');
            } else {
                document.getElementById('impactList').classList.add('hidden');
            }

            document.getElementById('sidebar').classList.remove('translate-x-full');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.add('translate-x-full');
        }

        function updatePathButton() {
            const btn = document.getElementById('btnPath');
            if (pathStartNode && selectedNode && pathStartNode !== selectedNode) {
                btn.classList.remove('hidden');
            } else {
                btn.classList.add('hidden');
            }
        }

        // --- Flow Analysis ---
        function highlightPredecessors() {
            if (!selectedNode) return;
            resetHighlight();
            
            const predecessors = selectedNode.predecessors();
            const connectedEdges = selected.connectedEdges ? selectedNode.connectedEdges() : cy.collection();
            
            cy.elements().addClass('faded');
            selectedNode.removeClass('faded').addClass('highlighted');
            predecessors.removeClass('faded').addClass('highlighted');
            connectedEdges.removeClass('faded').addClass('highlighted');
        }

        function highlightSuccessors() {
            if (!selectedNode) return;
            resetHighlight();
            
            const successors = selectedNode.successors();
            const connectedEdges = selectedNode.connectedEdges();
            
            cy.elements().addClass('faded');
            selectedNode.removeClass('faded').addClass('highlighted');
            successors.removeClass('faded').addClass('highlighted');
            connectedEdges.removeClass('faded').addClass('highlighted');
        }

        function resetHighlight() {
            cy.elements().removeClass('highlighted faded path-node path-edge cycle-node cycle-edge');
        }

        // --- Active/Deactive with Cascading ---
        function toggleNodeStatus() {
            if (!selectedNode) {
                showToast('Pilih node terlebih dahulu');
                return;
            }
            
            if (selectedNode.hasClass('deactive')) {
                // Reactivate: also reactivate downstream
                selectedNode.removeClass('deactive');
                selectedNode.successors().removeClass('deactive');
                selectedNode.connectedEdges().removeClass('deactive');
                showToast(`Node "${selectedNode.data('id')}" diaktifkan`);
            } else {
                // Deactivate with cascading
                selectedNode.addClass('deactive');
                selectedNode.successors().addClass('deactive');
                selectedNode.connectedEdges().addClass('deactive');
                showToast(`Node "${selectedNode.data('id')}" dinonaktifkan (cascading)`);
            }
        }

        // --- Critical Path ---
        function findPathFromSelected() {
            if (!pathStartNode || !selectedNode) return;
            if (pathStartNode === selectedNode) {
                showToast('Pilih node tujuan yang berbeda');
                return;
            }

            try {
                const dijkstra = cy.elements().dijkstra({
                    root: pathStartNode,
                    goal: selectedNode,
                    weight: () => 1
                });
                
                if (!dijkstra || dijkstra.distance === Infinity) {
                    showToast('Tidak ada jalur antara kedua node');
                    return;
                }

                const path = dijkstra.path;
                resetHighlight();
                path.nodes().addClass('path-node');
                path.edges().addClass('path-edge');
                cy.fit(path, 80);
                showToast(`Jalur ditemukan: ${path.nodes().length} node`);
                
                // Set next click as new start
                pathStartNode = null;
                updatePathButton();
            } catch (err) {
                showToast('Error mencari jalur');
            }
        }

        // Set first click as path start
        cy.on && document.addEventListener('DOMContentLoaded', () => {
            // Override tap for path start
            const origTap = cy;
        });

        // Double-click to set path start
        document.addEventListener('DOMContentLoaded', () => {
            let lastTap = 0;
            cy.on('tap', 'node', function(evt){
                const now = Date.now();
                if (now - lastTap < 300) {
                    // Double click: set as path start
                    pathStartNode = evt.target;
                    evt.target.addClass('highlighted');
                    showToast(`Path start: "${evt.target.data('id')}". Klik node lain lalu "Find Path"`);
                    updatePathButton();
                }
                lastTap = now;
            });
        });

        // --- Cycle Detection (DFS) ---
        function detectCycles() {
            resetHighlight();
            const cycles = [];
            const visited = new Set();
            const recStack = new Set();
            const cycleEdges = new Set();
            const cycleNodes = new Set();

            // Build adjacency list
            const adj = {};
            const edgeMap = {};
            cy.nodes().forEach(n => { adj[n.id()] = []; });
            cy.edges().forEach(e => {
                adj[e.source().id()].push(e.target().id());
                edgeMap[`${e.source().id()}-${e.target().id()}`] = e;
            });

            function dfs(node, parent) {
                visited.add(node);
                recStack.add(node);
                
                for (const neighbor of (adj[node] || [])) {
                    if (!visited.has(neighbor)) {
                        dfs(neighbor, node);
                    } else if (recStack.has(neighbor)) {
                        // Found cycle
                        const edgeKey = `${node}-${neighbor}`;
                        cycleEdges.add(edgeKey);
                        cycleNodes.add(node);
                        cycleNodes.add(neighbor);
                    }
                }
                recStack.delete(node);
            }

            cy.nodes().forEach(n => {
                if (!visited.has(n.id())) {
                    dfs(n.id(), null);
                }
            });

            // Highlight
            cycleNodes.forEach(id => {
                const n = cy.getElementById(id);
                if (n.length) n.addClass('cycle-node');
            });
            cycleEdges.forEach(key => {
                const e = edgeMap[key];
                if (e) e.addClass('cycle-edge');
            });

            document.getElementById('statCycles').textContent = cycleEdges.size;
            
            if (cycleEdges.size > 0) {
                showToast(`Ditemukan ${cycleEdges.size} back-edge (siklus)`);
                cy.fit(cy.nodes('.cycle-node'), 80);
            } else {
                showToast('Tidak ada siklus terdeteksi');
            }
        }

        // --- Export ---
        function exportImage() {
            const png64 = cy.png({ full: true, bg: '#f1f5f9', scale: 2 });
            const link = document.createElement('a');
            link.download = 'graph-export.png';
            link.href = png64;
            link.click();
            showToast('Gambar berhasil diunduh');
        }

        function exportMermaid() {
            let mermaid = "graph TD\n";
            const nodeIds = new Set();
            
            cy.nodes().forEach(n => {
                const safeId = n.data('id').replace(/[^a-zA-Z0-9]/g, '_');
                if (!nodeIds.has(safeId)) {
                    mermaid += `    ${safeId}["${n.data('id')}"]\n`;
                    nodeIds.add(safeId);
                }
            });
            
            cy.edges().forEach(e => {
                const src = e.source().data('id').replace(/[^a-zA-Z0-9]/g, '_');
                const tgt = e.target().data('id').replace(/[^a-zA-Z0-9]/g, '_');
                mermaid += `    ${src} --> ${tgt}\n`;
            });
            
            const blob = new Blob([mermaid], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'graph.mermaid';
            link.click();
            showToast('File Mermaid berhasil diunduh');
        }

        // --- Utilities ---
        function resetView() {
            cy.elements().show();
            cy.nodes().removeClass('deactive highlighted path-node cycle-node faded');
            cy.edges().removeClass('deactive highlighted path-edge cycle-edge faded');
            document.getElementById('searchInput').value = '';
            document.getElementById('typeFilter').value = 'all';
            document.getElementById('moduleFilter').value = 'all';
            searchResults = [];
            document.getElementById('searchNav').classList.add('hidden');
            pathStartNode = null;
            selectedNode = null;
            closeSidebar();
            
            if (heatmapActive) toggleHeatmap();
            
            cy.layout({ name: 'cose', animate: true }).run();
            setTimeout(() => cy.fit(null, 50), 900);
            showToast('View direset');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
    </script>
</body>
